<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Wohnungsbuchungen 2025</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .flex-container { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .form-section { background: #f9f9f9; padding: 15px; border-radius: 6px; width: 300px; }
    .calendar-section { margin-top: 20px; }
    label { display: block; margin-top: 8px; }
    input, select { width: 100%; padding: 5px; }
    button { margin-top: 10px; padding: 8px 16px; }
    table { border-collapse: collapse; font-size: 11px; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: center; min-width: 35px; min-height: 25px; }
    th { background: #eee; }
    td.reserved { background-color: #f99; cursor: pointer; }
    .calendar-wrapper { overflow-x: auto; }
    .month-nav { margin-bottom: 10px; }
</style>
</head>
<body>

<h2>Wohnungsbuchungen 2025</h2>

<div class="flex-container">
    <div class="form-section">
        <details open>
            <summary><strong>Wohnungen verwalten</strong></summary>
            <ul id="apartmentList" style="list-style:none; padding:0; margin-top:10px;"></ul>
            <button onclick="addApartment()">Wohnung hinzufügen</button>
        </details>
    </div>

    <div class="form-section">
        <form onsubmit="addBooking(); return false;">
            <label>Von: <input type="date" id="startDate" required></label>
            <label>Bis: <input type="date" id="endDate" required></label>
            <label>Wohnung:
                <select id="apartmentSelect"></select>
            </label>
            <label>Firma: <input type="text" id="companyName" required></label>
            <label>Rechnungsbetrag (€): <input type="number" id="invoiceAmount" required></label>
            <label>Email: <input type="email" id="companyEmail" required></label>
            <button type="submit">Buchung speichern</button>
        </form>
        <button onclick="exportToExcel()">Export nach Excel</button>
    </div>
</div>

<div class="calendar-section">
    <div class="month-nav">
        <button onclick="changeMonth(-1)">&#8592; Zurück</button>
        <span id="monthLabel" style="font-weight:bold; margin: 0 20px;"></span>
        <button onclick="changeMonth(1)">Weiter &#8594;</button>
    </div>
    <div class="calendar-wrapper">
        <table id="calendarTable">
            <thead id="calendarHead"></thead>
            <tbody id="calendarBody"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="modal" style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%);
    background:white; border:2px solid #ccc; padding:20px; z-index:1000; width:300px; font-size:14px;">
    <h3>Buchung bearbeiten</h3>
    <label>Von: <input type="date" id="editStartDate"></label>
    <label>Bis: <input type="date" id="editEndDate"></label>
    <label>Wohnung:
        <select id="editApartmentSelect"></select>
    </label>
    <label>Firma: <input type="text" id="editCompanyName"></label>
    <label>Email: <input type="email" id="editEmail"></label>
    <label>Rechnungsbetrag (€): <input type="number" id="editAmount"></label>
    <div style="margin-top:10px;">
        <button onclick="saveChanges()">Speichern</button>
        <button onclick="deleteBooking()">Löschen</button>
        <button onclick="closeModal()">Abbrechen</button>
    </div>
</div>

<script>

', '2025-10-09', '2025-10-10', '2025-10-11', '2025-10-12', '2025-10-13', '2025-10-14', '2025-10-15', '2025-10-16', '2025-10-17', '2025-10-18', '2025-10-19', '2025-10-20', '2025-10-21', '2025-10-22', '2025-10-23', '2025-10-24', '2025-10-25', '2025-10-26', '2025-10-27', '2025-10-28', '2025-10-29', '2025-10-30', '2025-10-31'], 11: ['2025-11-01', '2025-11-02', '2025-11-03', '2025-11-04', '2025-11-05', '2025-11-06', '2025-11-07', '2025-11-08', '2025-11-09', '2025-11-10', '2025-11-11', '2025-11-12', '2025-11-13', '2025-11-14', '2025-11-15', '2025-11-16', '2025-11-17', '2025-11-18', '2025-11-19', '2025-11-20', '2025-11-21', '2025-11-22', '2025-11-23', '2025-11-24', '2025-11-25', '2025-11-26', '2025-11-27', '2025-11-28', '2025-11-29', '2025-11-30'], 12: ['2025-12-01', '2025-12-02', '2025-12-03', '2025-12-04', '2025-12-05', '2025-12-06', '2025-12-07', '2025-12-08', '2025-12-09', '2025-12-10', '2025-12-11', '2025-12-12', '2025-12-13', '2025-12-14', '2025-12-15', '2025-12-16', '2025-12-17', '2025-12-18', '2025-12-19', '2025-12-20', '2025-12-21', '2025-12-22', '2025-12-23', '2025-12-24', '2025-12-25', '2025-12-26', '2025-12-27', '2025-12-28', '2025-12-29', '2025-12-30', '2025-12-31']};
let currentMonth = 1;
let currentEditIndex = null;

let apartments = JSON.parse(localStorage.getItem('apartments2025') || '["Wohnung 1","Wohnung 2","Wohnung 3"]');
let bookings = JSON.parse(localStorage.getItem('bookings2025') || '[]');

function renderApartmentList() {
    const ul = document.getElementById('apartmentList');
    ul.innerHTML = '';
    apartments.forEach((name, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<input value="${name}" onchange="renameApartment(${i}, this.value)" />
                        <button onclick="removeApartment(${i})">Löschen</button>`;
        ul.appendChild(li);
    });
    updateApartmentSelects();
    buildCalendar();
}

function renameApartment(index, value) {
    apartments[index] = value;
    localStorage.setItem('apartments2025', JSON.stringify(apartments));
    renderApartmentList();
}

function addApartment() {
    if (apartments.length >= 50) {
        alert("Maximal 50 Wohnungen erlaubt.");
        return;
    }
    const name = prompt("Name der neuen Wohnung:", "Wohnung " + (apartments.length + 1));
    if (name) {
        apartments.push(name);
        localStorage.setItem('apartments2025', JSON.stringify(apartments));
        renderApartmentList();
    }
}

function removeApartment(index) {
    const aptKey = (index + 1).toString();
    const used = bookings.some(b => b.apartment === aptKey);
    if (used) {
        alert("Diese Wohnung ist bereits gebucht und kann nicht gelöscht werden.");
        return;
    }
    apartments.splice(index, 1);
    localStorage.setItem('apartments2025', JSON.stringify(apartments));
    renderApartmentList();
}

function updateApartmentSelects() {
    const select1 = document.getElementById('apartmentSelect');
    const select2 = document.getElementById('editApartmentSelect');
    select1.innerHTML = '';
    select2.innerHTML = '';
    apartments.forEach((name, i) => {
        const opt = new Option(name, i + 1);
        const opt2 = new Option(name, i + 1);
        select1.add(opt);
        select2.add(opt2);
    });
}

function buildCalendar() {
    const head = document.getElementById('calendarHead');
    const body = document.getElementById('calendarBody');
    const days = monthDays[currentMonth];
    document.getElementById("monthLabel").textContent = monthNames[currentMonth - 1];

    head.innerHTML = "<tr><th>Wohnung</th>" + days.map(d => `<th>${d.slice(8)}</th>`).join('') + "</tr>";
    body.innerHTML = '';
    apartments.forEach((apt, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `<th>${apt}</th>`;
        days.forEach(date => {
            const td = document.createElement('td');
            td.setAttribute('data-apartment', i + 1);
            td.setAttribute('data-date', date);
            const bookingIndex = bookings.findIndex(b => b.apartment == i + 1 && date >= b.start && date <= b.end);
            if (bookingIndex !== -1) {
                td.classList.add('reserved');
                td.setAttribute('data-booking', bookingIndex);
                td.setAttribute('onclick', 'showBookingDetails(this)');
            }
            row.appendChild(td);
        });
        body.appendChild(row);
    });
}

function addBooking() {
    bookings.push({
        start: document.getElementById('startDate').value,
        end: document.getElementById('endDate').value,
        apartment: document.getElementById('apartmentSelect').value,
        company: document.getElementById('companyName').value,
        amount: document.getElementById('invoiceAmount').value,
        email: document.getElementById('companyEmail').value
    });
    localStorage.setItem('bookings2025', JSON.stringify(bookings));
    buildCalendar();
}

function changeMonth(offset) {
    currentMonth += offset;
    if (currentMonth < 1) currentMonth = 12;
    if (currentMonth > 12) currentMonth = 1;
    buildCalendar();
}

function showBookingDetails(cell) {
    const index = cell.getAttribute('data-booking');
    if (index === null) return;
    currentEditIndex = parseInt(index);
    const b = bookings[currentEditIndex];
    document.getElementById('editStartDate').value = b.start;
    document.getElementById('editEndDate').value = b.end;
    document.getElementById('editApartmentSelect').value = b.apartment;
    document.getElementById('editCompanyName').value = b.company;
    document.getElementById('editEmail').value = b.email;
    document.getElementById('editAmount').value = b.amount;
    document.getElementById('modal').style.display = 'block';
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function deleteBooking() {
    if (currentEditIndex !== null) {
        if (confirm("Diese Buchung wirklich löschen?")) {
            bookings.splice(currentEditIndex, 1);
            localStorage.setItem('bookings2025', JSON.stringify(bookings));
            buildCalendar();
            closeModal();
        }
    }
}

function saveChanges() {
    if (currentEditIndex !== null) {
        bookings[currentEditIndex] = {
            start: document.getElementById('editStartDate').value,
            end: document.getElementById('editEndDate').value,
            apartment: document.getElementById('editApartmentSelect').value,
            company: document.getElementById('editCompanyName').value,
            email: document.getElementById('editEmail').value,
            amount: document.getElementById('editAmount').value
        };
        localStorage.setItem('bookings2025', JSON.stringify(bookings));
        buildCalendar();
        closeModal();
    }
}

function exportToExcel() {
    const ws_data = [["Von", "Bis", "Wohnung", "Firma", "Rechnungsbetrag", "Email"]];
    bookings.forEach(b => {
        const aptName = apartments[parseInt(b.apartment) - 1] || "Wohnung " + b.apartment;
        ws_data.push([b.start, b.end, aptName, b.company, b.amount, b.email]);
    });
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, "Buchungen");
    XLSX.writeFile(wb, "Wohnungsbuchungen_2025.xlsx");
}

renderApartmentList();
</script>
</body>
</html>
